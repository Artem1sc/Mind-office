<style>
:root{--ink:#382723;--muted:#8b6f5e;--paper:#fffdf7;--bg:#fff8ee;--line:#e7c6a9;--sun:#ffac30;--coral:#ff5a60;--sky:#5ac8fa;--green:#49bd85;--lilac:#ab88e6;--shadow:0 5px 0 var(--ink)}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;font-weight:600;font-size:16px;line-height:1.55;overflow-x:hidden}body:before{content:"";pointer-events:none;position:fixed;inset:0;opacity:.42;background-image:radial-gradient(#ead6bc .8px,transparent .8px);background-size:30px 30px;z-index:-1}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}img{max-width:100%;height:auto}h1,h2,h3,p{margin:0}h2{font-size:clamp(21px,3vw,29px);line-height:1.35}h3{font-size:19px}small,.small{font-size:12px}a{color:inherit}input,select,textarea{min-width:0;outline:none}input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}textarea{resize:vertical}input[type=checkbox]{accent-color:var(--green);width:19px;height:19px}
.hidden{display:none!important}.subtle{color:var(--muted)}.pad{padding:20px}.paper{background:var(--paper);background-image:radial-gradient(#f1e2d1 .7px,transparent .7px);background-size:29px 29px}.card{background:#fffaf0;border:4px solid var(--ink);border-radius:30px;box-shadow:0 6px 0 var(--ink);padding:22px}.box{border:3px solid var(--ink);border-radius:22px;background:#fffefa;padding:15px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.gap8{gap:8px}.stack{display:flex;flex-direction:column;gap:13px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:19px;padding-bottom:15px;border-bottom:2px dashed var(--line)}.pill{display:inline-flex;align-items:center;gap:5px;background:#fff7e5;border:2px solid var(--ink);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:900;white-space:nowrap}.pill.red{background:var(--coral);color:white}.pill.blue{background:#d5f4ff}.pill.green{background:#cff6e1}.pill.orange{background:#ffe5b2}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:19px;background:#fffdf8;box-shadow:0 3px 0 var(--ink);padding:9px 15px;font-weight:900;font-size:14px;line-height:1.3;text-decoration:none;white-space:nowrap;transition:transform .12s,box-shadow .12s;max-width:100%}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.btn.primary{background:var(--sun)}.btn.red{background:var(--coral);color:#fff}.btn.blue{background:var(--sky)}.btn.green{background:var(--green);color:white}.btn.cream{background:#fff1cf}.btn.ghost{background:#fffefa}.btn.tiny{padding:6px 9px;border-width:2px;border-radius:12px;font-size:12px}.btn.icon{padding:8px 10px;min-width:40px}.field{display:flex;flex-direction:column;gap:5px}.field>label{font-size:13px;font-weight:900;color:#755747}.field input,.field select,.field textarea,.entry{background:#fffdf8;border:2px solid #b99d86;border-radius:13px;padding:10px 11px;width:100%;font-weight:600;box-shadow:none}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.meter{height:12px;background:#f1e8de;border:2px solid #baa08a;border-radius:20px;overflow:hidden}.meter>span{display:block;height:100%;background:var(--green);border-radius:20px;transition:width .2s}.barline{display:flex;gap:9px;align-items:center}.barline .meter{flex:1}
header{position:sticky;top:0;z-index:30;background:#fffdf7ed;border-bottom:4px solid var(--ink);backdrop-filter:blur(12px);box-shadow:0 2px 12px #3827230d}header .inner{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:9px;min-width:190px;cursor:pointer}.brand img{width:51px;height:51px;object-fit:contain}.brand strong{font-size:20px;line-height:1.2;display:block;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:12px}.nav{display:flex;gap:3px;flex:1;justify-content:center;background:#fff3d5;border:2px solid var(--ink);border-radius:19px;padding:4px;min-width:0}.nav button{padding:10px clamp(8px,1.45vw,18px);white-space:nowrap;border:0;border-radius:13px;background:transparent;font-weight:900}.nav button.selected{background:var(--ink);color:white}.right-controls{display:flex;align-items:center;gap:8px}.lang{display:flex;gap:2px;border:2px solid var(--ink);padding:3px;border-radius:15px;background:#fff0cf}.lang button{padding:6px 11px;border:0;background:transparent;border-radius:10px;font-size:13px;font-weight:900}.lang button.active{background:var(--ink);color:white}.layout{max-width:1200px;padding:25px 18px 80px;margin:0 auto}.page{display:none}.page.active{display:block}.section{margin-bottom:27px;scroll-margin-top:125px}
.map{background:#e9f8fc;border-radius:34px;padding:24px;box-shadow:0 6px 0 var(--ink);border:4px solid var(--ink);position:relative;overflow:hidden}.map>p{margin:2px 0 22px;color:#658093}.island-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.island{padding:11px 10px 17px;text-align:center;border-radius:20px;min-width:0;cursor:pointer;transition:transform .15s}.island:hover{transform:translateY(-4px)}.island img{display:block;width:100%;aspect-ratio:1.35/1;object-fit:contain;mix-blend-mode:multiply}.island strong{display:block;font-size:20px;margin:6px 0}.island p{font-size:13px;color:#7c5d53;min-height:40px}.island button{margin-top:8px}.status{display:flex;gap:8px;flex-wrap:wrap}.status button.active{background:var(--sun)}

const taskLines=pending.map((x,i)=>`<div class="task-line"><span class="ico">${taskIcon(x,i)}</span><div class="grow"><strong style="display:block;overflow-wrap:anywhere">${esc(x.title)}</strong><div class="row gap8 wrap"><small class="subtle">${labelDeadline(x.deadline)} · ${fmt(taskSum(x))}</small><small>${pct(x)}%</small></div>${meter(pct(x))}</div><button class="btn tiny" data-act="editTask" data-id="${x.id}">${T('edit')}</button></div>`).join('');
const lab=`<section class="section card" id="lab"><div class="section-head"><div><h2>🧠 ${T('lab')}</h2><p class="subtle">${T('labDesc')}</p></div><button class="btn red" data-act="newTask">＋ ${T('create')}</button></div><div class="lab-layout">${brain}<div class="stack"><div class="box"><div class="row between"><h3>${T('tasks')}</h3><span class="pill orange">${pending.length}</span></div><div class="listcompact" style="margin-top:14px;max-height:430px;overflow:auto">${taskLines||`<div class="tip">${T('noTasks')}</div>`}</div></div><div class="tip">💡 ${T('localDemo')}</div></div></div></section>`;
const count=S.plan.filter(x=>x.done).length,total=S.plan.length,p=total?Math.round(count/total*100):0;
const plan=`<section class="section card" id="planArea"><div class="section-head"><div><h2>📋 ${T('plan')}</h2><p class="subtle">${T('planDesc')}</p></div><div class="box" style="min-width:210px"><strong>${T('completedToday')}: ${count} / ${total} ${T('taskUnit')} · ${p}%</strong>${meter(p)}</div></div><div class="row wrap" style="margin-bottom:18px"><button class="btn primary" data-act="addToPlan">＋ ${T('addToPlan')}</button><span class="pill red">${total} ${T('steps')}</span></div><div class="plan-list">${S.plan.length?S.plan.map((x,i)=>renderPlanCard(x,i)).join(''):`<div class="tip">${T('noPlan')}</div>`}</div></section>`;
const detectSection=`<section class="section card detective" id="detectiveArea"><div class="section-head"><div><h2>🔎 ${T('report')}</h2><p class="subtle">${T('reportDesc')}</p></div><button class="btn blue" data-act="goto" data-to="detective">${T('cases')} →</button></div><div class="detect-grid"><div class="box" style="text-align:center"><div class="detect-figure">🕵️‍♀️</div><h3>${T('advice')}</h3><p class="subtle">${detectiveAdvice()}</p><button class="btn red" style="margin-top:12px" data-act="newLog">＋ ${T('logNow')}</button></div><div class="box"><h3>📌 ${T('topTriggers')}</h3>${renderTriggers(true)}</div></div></section>`;
const spots=Array.from({length:Math.max(6,S.parking.length)},(_,i)=>S.parking[i]||null);
const parkSection=`<section class="section card parking" id="parkingArea"><div class="section-head"><div><h2>🅿️ ${T('parking')}</h2><p class="subtle">${T('parkingDesc')}</p></div><button class="btn green" data-act="newThought">＋ ${T('addThought')}</button></div><div class="parking-lot">${spots.map((item,i)=>item?`<div class="spot"><span class="pill">P${i+1}</span><div class="car">${['🚗','🚙','🚕','🚐','🚘'][i%5]}</div><div class="thought">${esc(item.content)}</div><div class="spot-actions"><button class="btn tiny" data-act="parkTask" data-id="${item.id}">${T('convertTask')}</button><button class="btn tiny" data-act="parkNote" data-id="${item.id}">${T('convertNote')}</button><button class="btn tiny" data-act="parkDelete" data-id="${item.id}">✕</button></div></div>`:`<div class="spot empty"><span class="pill">P${i+1}</span><div style="font-size:33px;opacity:.6">▯</div><small>${T('emptySpot')}</small></div>`).join('')}</div></section>`;
const boardSection=`<section class="section card" id="boardArea"><div class="section-head"><div><h2>🏆 ${T('board')}</h2><p class="subtle">${T('boardDesc')}</p></div><button class="btn primary" data-act="exportBadges">📷 ${T('share')}</button></div><div class="board" id="badgeBoard">${renderBadges()}</div></section>`;
return map+status+lab+plan+detectSection+parkSection+boardSection}
function renderPlanCard(x,i){let task=findTask(x.taskId),chunk=findChunk(task,x.chunkId),title=chunk?.title||x.label||task?.title||'',session=x.mins||chunk?.mins||15;let percent=task?pct(task):0;return `<article draggable="true" data-plan-id="${x.id}" class="plan-item ${x.done?'done':''}"><div><div class="plan-title"><button draggable="true" class="draghandle" title="Drag to reorder" data-act="noop">⠿</button><span class="num">${i+1}</span><div class="grow"><div class="name"><b>${x.done?'✓ ':''}${esc(title)}</b> — ${fmt(session)}</div>${i===0&&!x.done?`<span class="pill red">👉 ${T('first')}</span>`:''}</div></div><div class="plan-meta"><span class="subtle">${T('parent')}: ${esc(task?.title||'—')}</span><div class="barline">${meter(percent)}<strong>${percent}%</strong></div><small style="color:#e77824">💡 ${T('recommend')}</small><div class="reorder-btns"><button class="btn tiny" data-act="movePlan" data-id="${x.id}" data-dir="-1" title="${T('up')}">↑</button><button class="btn tiny" data-act="movePlan" data-id="${x.id}" data-dir="1" title="${T('down')}">↓</button></div></div></div><div class="plan-side"><div class="btn cream" style="padding:2px 4px;gap:2px" title="${T('duration')}"><button class="btn tiny" style="border:0;box-shadow:none;background:transparent;padding:5px 6px" data-act="adjustPlan" data-id="${x.id}" data-n="-5" aria-label="−5 min">−</button><span style="white-space:nowrap;flex:1;text-align:center;font-size:12px">${fmt(session)}</span><button class="btn tiny" style="border:0;box-shadow:none;background:transparent;padding:5px 6px" data-act="adjustPlan" data-id="${x.id}" data-n="5" aria-label="+5 min">＋</button></div><button class="btn ghost" data-act="removePlan" data-id="${x.id}">✕ <span>${T('delete')}</span></button><button class="btn ghost" data-act="skipPlan" data-id="${x.id}">↷ <span>${T('skip')}</span></button><button class="btn blue" data-act="splitPlan" data-id="${x.id}">✂ <span>${T('split')}</span></button><button class="btn green" data-act="finishPlan" data-id="${x.id}" ${x.done?'disabled':''}>✓ <span>${T('finish')}</span></button><button class="btn primary" data-act="startPlan" data-id="${x.id}" ${x.done?'disabled':''}>▶ <span>${T('start')}</span></button></div></article>`}
function renderTasks(){const active=S.tasks.filter(x=>!allDone(x)),done=S.tasks.filter(allDone);return `<section class="section card"><div class="section-head"><div><h2>📚 ${T('taskManage')}</h2><p class="subtle">${T('taskDesc')}</p></div><button class="btn red" data-act="newTask">＋ ${T('newTask')}</button></div><div class="row wrap" style="margin-bottom:16px"><span class="pill orange">${active.length} ${T('tasks')}</span><span class="pill green">${done.length} ${T('finish')}</span><button class="btn tiny" data-act="reset" style="margin-left:auto">↶ ${T('restore')}</button></div><div class="tasks-grid">${S.tasks.map((x,i)=>`<article class="task-card"><div class="titleline"><span style="font-size:29px">${taskIcon(x,i)}</span><h3>${esc(x.title)}</h3><span class="pill ${allDone(x)?'green':'orange'}">${pct(x)}%</span></div><p class="subtle small" style="margin:6px 0 12px">${T('deadline')}: ${labelDeadline(x.deadline)} · ${T('duration')}: ${fmt(taskSum(x))} · ${T(x.importance)}</p>${meter(pct(x))}<div class="taskchunks">${x.chunks.map(c=>`<label class="${c.done?'done':''}"><input type="checkbox" data-act="chunkCheck" data-task="${x.id}" data-chunk="${c.id}" ${c.done?'checked':''}> <span class="grow">${esc(c.title)}</span><small>${fmt(c.mins)}</small></label>`).join('')}</div><div class="row wrap" style="margin-top:13px"><button class="btn tiny" data-act="editTask" data-id="${x.id}">${T('edit')}</button><button class="btn tiny" data-act="planTask" data-id="${x.id}">＋ ${T('addToPlan')}</button><button class="btn tiny" data-act="deleteTask" data-id="${x.id}">${T('delete')}</button></div></article>`).join('')||`<div class="tip">${T('noTasks')}</div>`}</div></section>`}

function detectiveAdvice(){let stats=logStats();let key=Object.entries(stats).sort((a,b)=>b[1]-a[1])[0]?.[0];let zh={phone:'把手機調成勿擾，先做 15 分鐘專注衝刺。',too_hard:'把目前步驟再切成 5–10 分鐘的簡單小步。',no_next_step:'先寫下現在唯一需要做的下一個具體動作。',boring:'搭配短計時與小獎勵，讓枯燥任務有終點。',too_tired:'先休息喝水，回來從短一點的任務開始。',random_thought:'把念頭停放在停車格，不需要立即處理。',otherReason:'觀察分心發生的時機，先試一段短衝刺。'};let en={phone:'Put your phone on Do Not Disturb and start a 15-minute sprint.',too_hard:'Break the next action into a tiny 5–10-minute step.',no_next_step:'Write down the single, concrete next action.',boring:'Use a short timer and a small reward for a clear finish line.',too_tired:'Take a brief break and restart with a short session.',random_thought:'Park this thought and return to your current task.',otherReason:'Notice when focus drifts and begin with a short sprint.'};return (S.lang==='en'?en:zh)[key||'no_next_step']}

function renderReports(){let avg=S.logs.length?Math.round(S.logs.reduce((v,x)=>v+x.minutes,0)/S.logs.length):0,counts=Object.entries(logStats()).sort((a,b)=>b[1]-a[1]);return `<section class="section card detective"><div class="section-head"><div><h2>🔍 ${T('report')}</h2><p class="subtle">${T('reportDesc')}</p></div><button class="btn red" data-act="newLog">＋ ${T('logNow')}</button></div><div class="stats"><div class="stat"><strong>${S.logs.length}</strong><small>${T('totalReports')}</small></div><div class="stat"><strong>${fmt(avg)}</strong><small>${T('avgMinute')}</small></div><div class="stat"><strong style="font-size:14px">${counts[0]?T(counts[0][0]):'—'}</strong><small>${T('mostCommon')}</small></div></div><div class="detect-grid" style="margin-top:18px"><div class="box"><h3>🧩 ${T('topTriggers')}</h3>${renderTriggers()}</div><div class="box"><h3>🕵️ ${T('advice')}</h3><div class="detect-figure">🔎</div><p>${detectiveAdvice()}</p><div class="tip" style="margin-top:14px">${T('localDemo')}</div></div></div><h3 style="margin:22px 0 11px">📂 ${T('cases')}</h3><div class="stack">${S.logs.length?S.logs.slice().reverse().map(x=>`<div class="log"><div class="row between wrap"><strong>${T(x.reason)}</strong><small>${new Date(x.at).toLocaleString(S.lang==='zh'?'zh-TW':'en-US')}</small></div><small>${T('elapsed')}: ${fmt(x.minutes)}${x.taskTitle?' · '+esc(x.taskTitle):''}</small><p>${esc(x.note||'')}</p></div>`).join(''):`<div class="tip">${T('caseEmpty')}</div>`}</div></section>`}
function renderBadges(){return S.badges.length?S.badges.map((b,i)=>{let x=b.x??((i%5)*18+5),y=b.y??(Math.floor(i/5)*30+7),icons=['🏆','⭐','📚','🌸','🐶','☕','🌊','🦄'];return `<div class="badge-sticker" data-badge-id="${b.id}" style="left:${x}%;top:${y}%;transform:rotate(${(i%5-2)*3}deg)"><b>${icons[i%icons.length]}</b><span>${esc(b.title)}</span><small>${new Date(b.at).toLocaleDateString(S.lang==='zh'?'zh-TW':'en-US')}</small></div>`}).join(''):`<div class="board-empty"><div><span>🏆</span><p>${T('emptyBoard')}</p></div></div>`}
function renderNotes(){const editing=window.noteEditing&&S.notes.find(x=>x.id===window.noteEditing);const rings=`<div class="diary-rings">${Array(9).fill('<i></i>').join('')}</div>`;return `<section class="section card diary-index"><div class="section-head"><div><h2>📓 ${T('diary')}</h2><p class="subtle">${T('diaryDesc')}</p></div><button class="btn primary" data-act="newNote">＋ ${T('newNote')}</button></div><div class="diary-book">${rings}<div class="book-head">📓 ${T('diary')} <span style="float:right">DIARY</span></div>${editing?renderNoteEditor(editing):`<div class="stack">${S.notes.length?S.notes.slice().sort((a,b)=>b.updated-a.updated).map((n,i)=>`<button class="note-entry" data-act="openNote" data-id="${n.id}" style="border:0;border-bottom:2px solid #e3c4a6;background:none;text-align:left;width:100%"><strong style="overflow-wrap:anywhere">${esc(n.title)}</strong><small class="subtle">${esc(n.date)}</small></button>`).join(''):`<div class="tip">${T('noNotes')}</div>`}</div>`}</div></section>`}
function renderNoteEditor(note){return `<div><div class="row between wrap"><button class="btn tiny" data-act="closeNote">← ${T('back')}</button><button class="btn tiny" data-act="deleteNote" data-id="${note.id}">${T('noteDelete')}</button></div><div class="field" style="margin-top:15px"><label>${T('noteTitle')}</label><input id="noteTitle" value="${esc(note.title)}" placeholder="${T('noteTitle')}"></div><small class="subtle">${esc(note.date)} · ${T('noteHint')}</small><div class="stack" style="margin:19px 0">${note.lines.map((l,i)=>`<div class="note-item" draggable="true" data-line-id="${l.id}"><select data-note-type="${l.id}"><option value="text" ${l.type==='text'?'selected':''}>${T('typeText')}</option><option value="bullet" ${l.type==='bullet'?'selected':''}>${T('typeBullet')}</option><option value="numbered" ${l.type==='numbered'?'selected':''}>${T('typeNumber')}</option><option value="check" ${l.type==='check'?'selected':''}>${T('typeCheck')}</option></select><div class="row gap8" style="align-items:flex-start">${l.type==='check'?`<input type="checkbox" data-note-check="${l.id}" ${l.done?'checked':''}>`:l.type==='bullet'?'• ':l.type==='numbered'?(note.lines.filter((a,j)=>j<=i&&a.type==='numbered').length)+'. ':''}<textarea data-note-line="${l.id}" rows="2" placeholder="${T('noteText')}">${esc(l.text)}</textarea></div><div style="display:flex;flex-direction:column;gap:2px"><button class="btn tiny" style="padding:2px 5px" data-act="moveLine" data-dir="-1" data-id="${l.id}">↑</button><button class="btn tiny" style="padding:2px 5px" data-act="moveLine" data-dir="1" data-id="${l.id}">↓</button><button class="btn tiny" style="padding:2px 5px" data-act="deleteLine" data-id="${l.id}">×</button></div></div>`).join('')}</div><div class="row wrap"><button class="btn cream" data-act="addLine">＋ ${T('addLine')}</button><button class="btn green" data-act="saveNote">✓ ${T('noteSave')}</button></div></div>`}
let DRAFT=null,SESSION=null,TIMER=null;
function showModal(title,body,wide=false){q('modalRoot').innerHTML=`<div class="modal-backdrop" data-act="backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn icon" data-act="closeModal" aria-label="Close">✕</button></div>${body}</div></div>`;document.body.style.overflow='hidden'}
function closeModal(){q('modalRoot').innerHTML='';document.body.style.overflow='';DRAFT=null}
function showTaskModal(taskId=null,prefill=''){
const old=taskId?findTask(taskId):null;DRAFT={id:old?.id||null,title:old?.title||prefill,deadline:old?.deadline||'none',importance:old?.importance||'medium',category:old?.category||'study',chunks:old?.chunks.map(c=>({...c}))||[{id:newId('c'),title:'',mins:15,done:false}],icon:old?.icon||'🧩'};

function readTaskModal(){if(!DRAFT)return;DRAFT.title=q('editTaskTitle')?.value??DRAFT.title;DRAFT.deadline=q('editDeadline')?.value??DRAFT.deadline;DRAFT.importance=q('editImportance')?.value??DRAFT.importance;DRAFT.category=q('editCategory')?.value??DRAFT.category;DRAFT.icon=q('editIcon')?.value??DRAFT.icon;DRAFT.chunks.forEach((c,i)=>{c.title=q('chunkTitle'+i)?.value??c.title;c.mins=Math.max(1,Math.min(900,Number(q('chunkTime'+i)?.value)||c.mins))})}
function renderTaskModal(){if(!DRAFT)return;const selects=(arr,val)=>arr.map(s=>`<option value="${s}" ${s===val?'selected':''}>${T(s)}</option>`).join('');let body=`<div class="stack"><div class="field"><label>${T('taskName')}</label><input id="editTaskTitle" value="${esc(DRAFT.title)}" placeholder="${T('taskName')}" maxlength="150"></div><div class="form-grid"><div class="field"><label>${T('deadline')}</label><select id="editDeadline">${selects(['today','tomorrow','weekend','nextweek','none'],DRAFT.deadline)}</select></div><div class="field"><label>${T('importance')}</label><select id="editImportance">${selects(IMPORTANCE,DRAFT.importance)}</select></div><div class="field"><label>${T('category')}</label><select id="editCategory">${selects(CAT,DRAFT.category)}</select></div><div class="field"><label>${T('category')} icon</label><select id="editIcon">${ICONS.map(x=>`<option ${x===DRAFT.icon?'selected':''} value="${x}">${x}</option>`).join('')}</select></div></div><div class="box"><div class="row between wrap"><h3>${T('chunks')}</h3><span class="pill orange">${fmt(DRAFT.chunks.reduce((n,c)=>n+Number(c.mins||0),0))}</span></div><div style="margin:12px 0">${DRAFT.chunks.map((c,i)=>`<div class="chunkedit"><input id="chunkTitle${i}" value="${esc(c.title)}" placeholder="${T('chunkName')}"><input id="chunkTime${i}" type="number" min="1" max="900" value="${c.mins}" aria-label="minutes"><button class="btn icon tiny" data-act="draftRemove" data-n="${i}" ${DRAFT.chunks.length===1?'disabled':''}>×</button></div>`).join('')}</div><div class="row wrap"><button class="btn tiny cream" data-act="draftAdd">${T('addChunk')}</button><button class="btn tiny blue" data-act="draftPreset">${T('preset')}</button><button class="btn tiny primary" data-act="draftSmart">✨ ${T('aiSplit')}</button></div><small class="subtle">${T('localDemo')}</small></div><div class="row wrap" style="justify-content:flex-end"><button class="btn" data-act="closeModal">${T('cancel')}</button><button class="btn green" data-act="saveTask">✓ ${T('save')}</button></div></div>`;showModal(DRAFT.id?T('editTask'):T('newTask'),body,true)}
function smartSplit(){if(!DRAFT)return;readTaskModal();let name=DRAFT.title.trim()|| (S.lang==='zh'?'新任務':'Task');let count=3;let total=Math.max(15,Math.min(900,DRAFT.chunks.reduce((a,c)=>a+c.mins,0)||60));let parts=S.lang==='zh'?['先整理材料並確認下一步','完成主要內容','檢查並收尾']:['Gather materials and define next step','Complete the main work','Review and wrap up'];let base=Math.floor(total/count),rem=total%count;DRAFT.chunks=parts.map((p,i)=>({id:newId('c'),title:`${name}：${p}`,mins:base+(i===count-1?rem:0),done:false}));renderTaskModal()}
function presetSplit(){readTaskModal();let total=Math.max(15,DRAFT.chunks.reduce((a,c)=>a+c.mins,0));let base=Math.floor(total/3);DRAFT.chunks=Array.from({length:3},(_,i)=>({id:newId('c'),title:`${DRAFT.title||T('taskName')} ${i+1}/3`,mins:base+(i===2?total%3:0),done:false}));renderTaskModal()}
function saveTask(){readTaskModal();if(!DRAFT.title?.trim()){toast(T('invalid'));return}DRAFT.chunks=DRAFT.chunks.filter(c=>c.title.trim()).map(c=>({...c,mins:Math.max(1,Math.min(900,Number(c.mins)||15))}));if(!DRAFT.chunks.length)DRAFT.chunks=[{id:newId('c'),title:DRAFT.title,mins:15,done:false}];if(DRAFT.chunks.reduce((a,c)=>a+c.mins,0)>900){toast(S.lang==='zh'?'總時間最多 900 分鐘':'Maximum total: 900 min');return}if(DRAFT.id){let t=findTask(DRAFT.id);Object.assign(t,{title:DRAFT.title,deadline:DRAFT.deadline,importance:DRAFT.importance,category:DRAFT.category,chunks:DRAFT.chunks,icon:DRAFT.icon});const still=new Set(DRAFT.chunks.map(x=>x.id));S.plan=S.plan.filter(p=>p.taskId!==t.id||!p.chunkId||still.has(p.chunkId));S.plan.forEach(p=>{if(p.taskId===t.id){let c=t.chunks.find(c=>c.id===p.chunkId);if(c){p.mins=c.mins;p.done=!!c.done}}})}else{S.tasks.push({id:newId('t'),title:DRAFT.title,deadline:DRAFT.deadline,importance:DRAFT.importance,category:DRAFT.category,chunks:DRAFT.chunks,icon:DRAFT.icon,createdAt:Date.now()})}save();closeModal();render();toast(T('taskCreated'))}
function makePlan(mode='manual',singleTask=null){let list=S.tasks.filter(t=>!allDone(t)&&(!singleTask||t.id===singleTask));if(mode==='smart'){const imp={urgent:4,high:3,medium:2,low:1},dead={today:5,tomorrow:4,weekend:3,nextweek:2,none:1};list=list.slice().sort((a,b)=>imp[b.importance]*10+dead[b.deadline]-(imp[a.importance]*10+dead[a.deadline])||a.createdAt-b.createdAt)}else list=list.slice().sort((a,b)=>a.createdAt-b.createdAt);
let chunks=list.flatMap(t=>t.chunks.filter(c=>!c.done).map(c=>({id:newId('p'),taskId:t.id,chunkId:c.id,mins:c.mins,done:false})));if(singleTask){let oldSet=new Set(S.plan.map(p=>p.chunkId));S.plan.push(...chunks.filter(c=>!oldSet.has(c.chunkId)))}else S.plan=chunks;save();render();q('planArea')?.scrollIntoView({behavior:'smooth',block:'start'});if(!chunks.length)toast(T('emptyPlan'))}
function removeTask(id){if(!confirm(T('confirmDelete')))return;S.tasks=S.tasks.filter(t=>t.id!==id);S.plan=S.plan.filter(p=>p.taskId!==id);save();render()}
function finalizeTask(task){if(!task||!allDone(task)||S.badges.some(x=>x.taskId===task.id))return;S.badges.push({id:newId('b'),taskId:task.id,title:task.title,at:Date.now(),x:5+(S.badges.length%4)*23,y:8+Math.floor(S.badges.length/4)*28});toast(T('completeAll'))}
function finishChunk(taskId,chunkId){let task=findTask(taskId),c=findChunk(task,chunkId);if(c){c.done=true;S.plan.forEach(p=>{if(p.taskId===taskId&&p.chunkId===chunkId)p.done=true});finalizeTask(task);save();render()}}
function planComplete(id){let p=S.plan.find(x=>x.id===id);if(!p)return;finishChunk(p.taskId,p.chunkId)}
function splitPlan(id){let idx=S.plan.findIndex(x=>x.id===id),p=S.plan[idx];if(!p||p.done)return;let task=findTask(p.taskId),c=findChunk(task,p.chunkId);if(!c){toast(T('noAvailable'));return}if(c.mins<2){toast(S.lang==='zh'?'時間已經很短了':'This step is already short');return}let a=Math.max(1,Math.floor(c.mins/2)),b=c.mins-a;let c2={id:newId('c'),title:c.title+' (2/2)',mins:b,done:false};c.title+=' (1/2)';c.mins=a;task.chunks.splice(task.chunks.indexOf(c)+1,0,c2);p.mins=a;S.plan.splice(idx+1,0,{id:newId('p'),taskId:task.id,chunkId:c2.id,mins:b,done:false});save();render()}
function adjustPlan(id,delta){let p=S.plan.find(x=>x.id===id);if(!p)return;p.mins=Math.max(1,Math.min(900,(p.mins||15)+delta));save();render()}
function skipPlan(id){let i=S.plan.findIndex(x=>x.id===id);if(i<0)return;S.plan.push(S.plan.splice(i,1)[0]);save();render()}
function movePlan(id,dir){let i=S.plan.findIndex(p=>p.id===id),j=i+dir;if(i<0||j<0||j>=S.plan.length)return;[S.plan[i],S.plan[j]]=[S.plan[j],S.plan[i]];save();render()}
function choosePlanTask(){let tasks=S.tasks.filter(t=>t.chunks.some(c=>!c.done));showModal(T('addToPlan'),`<div class="field"><label>${T('parent')}</label><select id="planTaskSelect">${tasks.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></div><p class="subtle small" style="margin:12px 0">${T('recommend')}</p><div class="row wrap"><button class="btn green" data-act="confirmPlanTask" ${tasks.length?'':'disabled'}>${T('addToPlan')}</button><button class="btn primary" data-act="newTask">＋ ${T('newTask')}</button></div>`)}
function addTaskFromParking(id){let p=S.parking.find(x=>x.id===id);if(!p)return;showTaskModal(null,p.content);window._parkingToTask=id}
function createNoteDraft(text='',parkId=null){window._parkingToNote=parkId;let note={id:newId('n'),date:new Date().toLocaleDateString(S.lang==='zh'?'zh-TW':'en-US'),title:text?(text.length>40?text.slice(0,40)+'…':text):(S.lang==='zh'?'新筆記':'New note'),lines:[{id:newId('l'),type:'text',text:text,done:false}],created:Date.now(),updated:Date.now()};S.notes.push(note);window.noteEditing=note.id;save();S.tab='notes';render()}

function startFocus(id){let p=S.plan.find(x=>x.id===id);if(!p)return;let t=findTask(p.taskId),c=findChunk(t,p.chunkId);SESSION={id,taskId:p.taskId,chunkId:p.chunkId,title:c?.title||t?.title||'',seconds:(p.mins||15)*60,playing:true,last:Date.now()};openFocus();startTicker()}
function openFocus(){if(!SESSION)return;showModal(T('session'),`<div style="text-align:center"><div style="font-size:50px">⏳</div><h3>${esc(SESSION.title)}</h3><div id="timerReadout" style="font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;margin:12px 0">${timerFmt(SESSION.seconds)}</div><p class="subtle">${T('keepWork')}</p><div class="row wrap" style="justify-content:center;margin-top:20px"><button class="btn primary" data-act="togglePause" id="pauseBtn">${T('pause')}</button><button class="btn" data-act="distractionFocus">${T('logDistraction')}</button><button class="btn green" data-act="finishFocus">✓ ${T('finishSession')}</button><button class="btn ghost" data-act="stopFocus">${T('stop')}</button></div></div>`)}
function timerFmt(n){n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function startTicker(){if(TIMER)clearInterval(TIMER);TIMER=setInterval(()=>{if(!SESSION||!SESSION.playing)return;const now=Date.now();SESSION.seconds=Math.max(0,SESSION.seconds-(now-SESSION.last)/1000);SESSION.last=now;if(q('timerReadout'))q('timerReadout').textContent=timerFmt(Math.ceil(SESSION.seconds));if(!SESSION.seconds){SESSION.playing=false;if(q('pauseBtn'))q('pauseBtn').textContent=T('resume');toast(S.lang==='zh'?'計時結束！':'Focus timer ended!')}},350)}
function stopTicker(){if(TIMER)clearInterval(TIMER);TIMER=null;SESSION=null}
function exportBadges(){const cvs=document.createElement('canvas'),ctx=cvs.getContext('2d');cvs.width=1200;cvs.height=780;ctx.fillStyle='#f0dbad';ctx.fillRect(0,0,1200,780);ctx.lineWidth=20;ctx.strokeStyle='#88533b';ctx.strokeRect(10,10,1180,760);ctx.fillStyle='#382723';ctx.font='bold 44px system-ui';ctx.fillText(S.lang==='zh'?'腦內事務所 · 成就布告欄':'Mind Office · Achievement Board',60,85);const icons=['🏆','⭐','📚','🌸','🐶','☕','🌊','🎯'];if(!S.badges.length){ctx.font='bold 32px system-ui';ctx.fillText(T('emptyBoard'),70,220)}S.badges.forEach((b,i)=>{let x=60+(b.x??(i%5*18+5))*10,y=100+(b.y??Math.floor(i/5)*30+7)*6;x=Math.max(55,Math.min(970,x));y=Math.max(120,Math.min(630,y));ctx.fillStyle='#fff8e9';ctx.strokeStyle='#382723';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(x,y,170,120,20);ctx.fill();ctx.stroke();ctx.font='48px system-ui';ctx.fillStyle='#382723';ctx.fillText(icons[i%icons.length],x+55,y+55);ctx.font='bold 16px system-ui';const txt=b.title||'';ctx.fillText(txt.length>11?txt.slice(0,11)+'…':txt,x+10,y+90)});const download=(url)=>{let a=document.createElement('a');a.href=url;a.download='mind-office-achievements.jpg';a.click()};download(cvs.toDataURL('image/jpeg',.92))}
// Event delegation lets a single-file app re-render without losing button listeners.
document.addEventListener('click',function(ev){let btn=ev.target.closest('[data-act]');if(!btn)return;let a=btn.dataset.act,id=btn.dataset.id;ev.preventDefault();ev.stopPropagation();switch(a){
case 'noop':return;
case 'goto':showTab(btn.dataset.to);break;
case 'section':goSection(btn.dataset.to);break;
case 'language':S.lang=btn.dataset.lang;save();render();break;
case 'sound':S.sound=!S.sound;save();headerRender();break;
case 'state':S.status=Number(btn.dataset.n);save();render();break;
case 'newTask':showTaskModal();break;
case 'editTask':showTaskModal(id);break;
case 'saveTask':{let toTask=window._parkingToTask;saveTask();if(toTask&&!DRAFT){S.parking=S.parking.filter(p=>p.id!==toTask);window._parkingToTask=null;save();render()}break}
case 'deleteTask':removeTask(id);break;
case 'draftAdd':readTaskModal();DRAFT.chunks.push({id:newId('c'),title:'',mins:15,done:false});renderTaskModal();break;
case 'draftRemove':readTaskModal();DRAFT.chunks.splice(Number(btn.dataset.n),1);renderTaskModal();break;
case 'draftPreset':presetSplit();break;
case 'draftSmart':smartSplit();break;
case 'closeModal':if(SESSION)stopTicker();window._parkingToTask=null;closeModal();break;
case 'backdrop':if(ev.target===btn){if(SESSION)stopTicker();window._parkingToTask=null;closeModal()}break;
case 'organize':makePlan('smart');break;
case 'manual':makePlan('manual');break;
case 'addToPlan':choosePlanTask();break;
case 'confirmPlanTask':{let id=q('planTaskSelect')?.value;closeModal();if(id)makePlan('manual',id);break}
case 'planTask':makePlan('manual',id);break;
case 'removePlan':S.plan=S.plan.filter(p=>p.id!==id);save();render();break;
case 'skipPlan':skipPlan(id);break;
case 'splitPlan':splitPlan(id);break;
case 'finishPlan':planComplete(id);break;
case 'movePlan':movePlan(id,Number(btn.dataset.dir));break;
case 'duration':adjustPlan(id,5);break;
case 'adjustPlan':adjustPlan(id,Number(btn.dataset.n));break;
case 'startPlan':startFocus(id);break;
case 'newLog':newLogModal();break;
case 'saveLog':{let r=q('logReason')?.value,n=Math.max(0,Number(q('logTime')?.value)||0),note=q('logNote')?.value||'';S.logs.push({id:newId('d'),reason:r,minutes:n,note,at:Date.now(),taskTitle:SESSION?.title||''});save();if(SESSION)stopTicker();closeModal();render();toast(S.lang==='zh'?'偵探已記下線索！':'Clue recorded!');break}
case 'newThought':addParkingModal();break;
case 'saveParking':{let txt=q('parkingInput')?.value.trim();if(!txt){toast(T('invalid'));return}S.parking.push({id:newId('park'),content:txt,at:Date.now()});save();closeModal();render();break}
case 'parkTask':addTaskFromParking(id);break;
case 'parkNote':{let p=S.parking.find(x=>x.id===id);if(!p)return;createNoteDraft(p.content,id);break}
case 'parkDelete':S.parking=S.parking.filter(x=>x.id!==id);save();render();break;
case 'exportBadges':exportBadges();break;
case 'newNote':createNoteDraft();break;
case 'openNote':window.noteEditing=id;render();break;
case 'closeNote':{let n=noteActive();if(n){n.updated=Date.now();save()}window.noteEditing=null;render();break}
case 'saveNote':saveNote();break;
case 'deleteNote':{if(!confirm(T('confirmDelete')))return;S.notes=S.notes.filter(n=>n.id!==id);window.noteEditing=null;save();render();break}
case 'addLine':{let n=noteActive();if(!n)return;n.lines.push({id:newId('l'),type:'text',text:'',done:false});save();render();break}
case 'moveLine':{let n=noteActive();if(!n)return;let i=n.lines.findIndex(l=>l.id===id),j=i+Number(btn.dataset.dir);if(i<0||j<0||j>=n.lines.length)return;[n.lines[i],n.lines[j]]=[n.lines[j],n.lines[i]];save();render();break}
case 'deleteLine':{let n=noteActive();if(!n)return;n.lines=n.lines.filter(l=>l.id!==id);if(!n.lines.length)n.lines=[{id:newId('l'),type:'text',text:'',done:false}];save();render();break}
case 'togglePause':{if(!SESSION)return;SESSION.playing=!SESSION.playing;SESSION.last=Date.now();btn.textContent=SESSION.playing?T('pause'):T('resume');break}
case 'stopFocus':stopTicker();closeModal();break;
case 'finishFocus':{let id=SESSION?.id;stopTicker();closeModal();if(id)planComplete(id);break}
case 'distractionFocus':{if(!SESSION)return;SESSION.playing=false;let s=SESSION;newLogModal();q('logTime').value=Math.max(0,Math.round((S.plan.find(p=>p.id===s.id)?.mins||15)-s.seconds/60));break}
case 'reset':if(confirm(S.lang==='zh'?'確定重設本機作業版資料？':'Reset all local assignment data?')){let lang=S.lang;S=seed();S.lang=lang;window.noteEditing=null;save();render()}break;
}});
document.addEventListener('change',ev=>{let t=ev.target;if(t.matches('[data-act=chunkCheck]')){let task=findTask(t.dataset.task),c=findChunk(task,t.dataset.chunk);if(c){c.done=t.checked;if(t.checked){S.plan.forEach(p=>{if(p.chunkId===c.id)p.done=true});finalizeTask(task)}else{S.plan.forEach(p=>{if(p.chunkId===c.id)p.done=false});S.badges=S.badges.filter(b=>b.taskId!==task.id)}save();render()}}else if(t.matches('[data-note-type]')){let n=noteActive(),l=n?.lines.find(x=>x.id===t.dataset.noteType);if(l){l.type=t.value;save();render()}}else if(t.matches('[data-note-check]')){let n=noteActive(),l=n?.lines.find(x=>x.id===t.dataset.noteCheck);if(l){l.done=t.checked;save()}}});
document.addEventListener('input',ev=>{let t=ev.target,n=noteActive();if(!n)return;if(t.id==='noteTitle'){n.title=t.value;n.updated=Date.now();save()}if(t.matches('[data-note-line]')){let l=n.lines.find(x=>x.id===t.dataset.noteLine);if(l){l.text=t.value;n.updated=Date.now();save()}}});
// Desktop drag-and-drop for action plan and diary lines.
let dragged=null;
document.addEventListener('dragstart',ev=>{let el=ev.target.closest('[data-plan-id],[data-line-id]');if(!el)return;dragged={kind:el.dataset.planId?'plan':'line',id:el.dataset.planId||el.dataset.lineId};ev.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',ev=>{if(dragged&&ev.target.closest(dragged.kind==='plan'?'[data-plan-id]':'[data-line-id]'))ev.preventDefault()});
document.addEventListener('drop',ev=>{if(!dragged)return;const e=ev.target.closest(dragged.kind==='plan'?'[data-plan-id]':'[data-line-id]');if(!e)return;ev.preventDefault();if(dragged.kind==='plan'){let from=S.plan.findIndex(x=>x.id===dragged.id),to=S.plan.findIndex(x=>x.id===e.dataset.planId);if(from>=0&&to>=0){S.plan.splice(to,0,S.plan.splice(from,1)[0]);save();render()}}else{let n=noteActive();if(n){let from=n.lines.findIndex(x=>x.id===dragged.id),to=n.lines.findIndex(x=>x.id===e.dataset.lineId);if(from>=0&&to>=0){n.lines.splice(to,0,n.lines.splice(from,1)[0]);save();render()}}}dragged=null});
document.addEventListener('dragend',()=>dragged=null);
// Sticker drag uses pointer events, so it works on desktop and touchscreens.
let stickerPointer=null;
document.addEventListener('pointerdown',ev=>{let el=ev.target.closest('[data-badge-id]');if(!el||ev.button!==0)return;let board=q('badgeBoard');if(!board)return;let b=S.badges.find(x=>x.id===el.dataset.badgeId);if(!b)return;let r=board.getBoundingClientRect();stickerPointer={id:b.id,el,board,rect:r,px:ev.clientX,py:ev.clientY,x:b.x||0,y:b.y||0};el.setPointerCapture?.(ev.pointerId)});
document.addEventListener('pointermove',ev=>{if(!stickerPointer)return;let p=stickerPointer,dx=(ev.clientX-p.px)/p.rect.width*100,dy=(ev.clientY-p.py)/p.rect.height*100;let x=Math.max(0,Math.min(88,p.x+dx)),y=Math.max(0,Math.min(80,p.y+dy));p.el.style.left=x+'%';p.el.style.top=y+'%';let b=S.badges.find(b=>b.id===p.id);if(b){b.x=x;b.y=y}});
document.addEventListener('pointerup',()=>{if(stickerPointer){save();stickerPointer=null}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Tab'||ev.shiftKey||!ev.target.matches('[data-note-line]'))return;let n=noteActive();if(!n)return;ev.preventDefault();const idx=n.lines.findIndex(l=>l.id===ev.target.dataset.noteLine);if(idx<0)return;const next={id:newId('l'),type:n.lines[idx].type,text:'',done:false};n.lines.splice(idx+1,0,next);save();render();document.querySelector('[data-note-line="'+next.id+'"]')?.focus()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&q('modalRoot').children.length){if(SESSION){stopTicker()}window._parkingToTask=null;closeModal()}});
render();
</script>
</body></html>
